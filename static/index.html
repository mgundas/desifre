<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Deşifre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function () {
      try { var t = localStorage.getItem('desifre:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <noscript>Deşifre için JavaScript gerekir.</noscript>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
